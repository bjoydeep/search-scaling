# PostgreSQL Tuning Configuration — ACM Search Indexer
# Baseline: 20GB pod memory limit
# Workload: write-heavy UPSERT from search-indexer + JSONB GIN indexes + read queries from search-api
#
# Apply via: ALTER SYSTEM SET <param> = <value>;  followed by SELECT pg_reload_conf();
# Or mount this file and set: postgresql.conf include = 'postgres-tuning.conf'
# Verify active values: SELECT name, setting, unit FROM pg_settings WHERE name IN (...);

# ============================================================
# MEMORY
# ============================================================

# PostgreSQL's own buffer pool — largest single lever for performance.
# Rule of thumb: 25% of available RAM.
# 20GB pod → 5GB. Repeat queries on hot data (resources table) will
# be served from memory after first load.
shared_buffers = 5GB

# Estimate of total memory available for caching (OS page cache + shared_buffers).
# Used by the query planner to decide index scan vs sequential scan.
# Does NOT allocate memory — it's a hint only.
# Set to ~75% of RAM so the planner favours index scans on large tables.
effective_cache_size = 15GB

# Memory per sort/hash/distinct operation.
# CRITICAL for the getPropertyTypes query (SELECT DISTINCT ... jsonb_each):
# that query does a large sort after expanding all JSONB fields.
# WARNING: this is per operation, not per query. A query with 5 sort nodes
# can use 5 × work_mem. With DB_MAX_CONNECTIONS=10 and complex queries,
# peak usage can be: 10 connections × 5 ops × 64MB = 3.2GB.
# Do not raise above 128MB without monitoring actual memory usage.
work_mem = 64MB

# Memory for maintenance operations: VACUUM, ANALYZE, CREATE INDEX, REINDEX.
# The GIN index on search.resources.data is expensive to maintain —
# higher maintenance_work_mem speeds up GIN index builds after bulk loads.
maintenance_work_mem = 1GB

# ============================================================
# PARALLELISM
# ============================================================

# Max parallel workers a single Gather/Gather Merge node can use.
# Helps parallelize the full-table sequential scan in getPropertyTypes.
# Set to number of available vCPUs minus 1. Start with 4, tune up if CPU headroom allows.
max_parallel_workers_per_gather = 4

# Total parallel workers available across all active queries.
max_parallel_workers = 8

# Total background worker processes (includes parallel workers, autovacuum workers, etc.)
max_worker_processes = 10

# ============================================================
# WRITE / CHECKPOINT / WAL
# ============================================================

# Spread checkpoint I/O writes over 90% of the checkpoint interval.
# Prevents the I/O spike that occurs when all dirty pages flush at once.
# Without this, the indexer's write bursts can stall due to checkpoint pressure.
checkpoint_completion_target = 0.9

# How often PostgreSQL forces a checkpoint. Default 5min causes frequent I/O spikes
# under the indexer's continuous write load. 15min smooths writes at the cost of
# slightly longer crash recovery time (acceptable for this workload).
checkpoint_timeout = 15min

# WAL write buffer. 'auto' sets this to 1/32 of shared_buffers (capped at 16MB).
# Explicit 64MB reduces WAL write contention under concurrent collector syncs.
wal_buffers = 64MB

# ============================================================
# AUTOVACUUM
# ============================================================
# The indexer does constant UPSERTs to search.resources. Dead tuple bloat
# accumulates fast and inflates table size, slowing all queries including
# the full-table scan in getPropertyTypes. Aggressive autovacuum is essential.

# Trigger vacuum when dead tuples exceed 1% of table size.
# Default 20% means 200k dead rows on a 1M-row table before vacuum fires — too slow.
autovacuum_vacuum_scale_factor = 0.01

# Trigger ANALYZE when 0.5% of rows change. Keeps planner statistics fresh.
# Stale stats cause the planner to pick sequential scans over index scans.
autovacuum_analyze_scale_factor = 0.005

# Cost delay between autovacuum I/O operations.
# Default 20ms makes autovacuum very slow — it intentionally throttles to avoid
# impacting production workloads. For a write-heavy indexer, 2ms is more appropriate.
autovacuum_vacuum_cost_delay = 2ms

# Max autovacuum worker processes. Default 3 is fine for this single-database setup.
autovacuum_max_workers = 3

# Memory per autovacuum worker. Raise above default (64MB) so workers can sort
# and process the large search.resources table without repeated passes.
autovacuum_work_mem = 256MB

# ============================================================
# STORAGE / PLANNER COST
# ============================================================
# Tune these to match actual storage. Wrong values cause the planner to
# prefer sequential scans over index scans on SSD/NVMe deployments
# because defaults assume spinning disk.

# Cost of a random page fetch relative to sequential.
# Default 4.0 assumes HDD. On SSD random reads are ~2× sequential (not 4×).
# Adjust based on your storage class (see comments):
#   Local NVMe / high-performance SSD → 1.1
#   Cloud block SSD (gp3, pd-ssd, managed-premium) / ODF Ceph RBD → 1.5
#   HDD → 4.0 (do not use HDD for PostgreSQL)
random_page_cost = 1.5                 # ADJUST: set to 1.1 for local NVMe

# Number of concurrent async I/O requests the storage subsystem can handle.
# Higher values allow PostgreSQL to issue more parallel read-ahead requests.
#   Local NVMe → 200
#   Cloud SSD / ODF Ceph → 100
#   HDD → 2
effective_io_concurrency = 100         # ADJUST: set to 200 for local NVMe

# ============================================================
# CONNECTIONS
# ============================================================

# Must be >= total connections from all clients.
# search-indexer: DB_MAX_CONNECTIONS=10
# search-api:     DB_MAX_CONNECTIONS=10 (check its config)
# Reserve headroom for admin/monitoring connections.
# Each connection uses ~5-10MB of memory.
max_connections = 30

# ============================================================
# OBSERVABILITY
# ============================================================

# Enable slow query logging. Logs any query taking longer than 1 second.
# Essential for identifying other slow queries beyond getPropertyTypes.
log_min_duration_statement = 1000      # milliseconds

# Log when autovacuum runs on a table. Useful for verifying aggressive
# autovacuum settings above are actually firing.
log_autovacuum_min_duration = 0

# pg_stat_statements: tracks execution statistics for all SQL statements.
# Required for: SELECT query, mean_exec_time FROM pg_stat_statements ORDER BY mean_exec_time DESC
# Enable in shared_preload_libraries (requires restart):
#   shared_preload_libraries = 'pg_stat_statements'
# Then: CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
pg_stat_statements.max = 1000
pg_stat_statements.track = all

# ============================================================
# KEY METRICS TO WATCH (add postgres_exporter)
# ============================================================
# Run these queries periodically or wire into Prometheus via postgres_exporter:
#
# 1. Cache hit ratio (target > 99%):
#    SELECT sum(blks_hit)*100.0 / (sum(blks_hit)+sum(blks_read)) AS ratio
#    FROM pg_stat_database;
#
# 2. Table bloat / vacuum lag (n_dead_tup should stay low):
#    SELECT relname, n_live_tup, n_dead_tup, last_autovacuum, last_autoanalyze
#    FROM pg_stat_user_tables WHERE relname = 'resources';
#
# 3. Slowest queries (requires pg_stat_statements):
#    SELECT query, calls, mean_exec_time, total_exec_time
#    FROM pg_stat_statements ORDER BY mean_exec_time DESC LIMIT 10;
#
# 4. Active connections and wait events:
#    SELECT state, wait_event_type, wait_event, count(*)
#    FROM pg_stat_activity GROUP BY 1,2,3 ORDER BY 4 DESC;
#
# 5. Checkpoint frequency (should not be hitting max_wal_size constantly):
#    SELECT checkpoints_timed, checkpoints_req FROM pg_stat_bgwriter;
#    High checkpoints_req means WAL is filling faster than checkpoint_timeout — raise max_wal_size.

# ============================================================
# MEMORY BUDGET SUMMARY (20GB pod limit)
# ============================================================
# shared_buffers:              5.0 GB  (allocated at startup)
# max_connections × ~8MB:      0.24 GB (per-connection overhead)
# autovacuum_work_mem × 3:     0.75 GB (3 workers × 256MB)
# work_mem peak (worst case):  3.2 GB  (10 conns × 5 ops × 64MB)
# OS page cache / kernel:      ~2.0 GB
# PostgreSQL process overhead: ~0.5 GB
# ─────────────────────────────────────
# Total peak estimate:        ~11.7 GB  (comfortable within 20GB limit)
# Headroom:                   ~8.3 GB   (buffer for query spikes)
